name: E2E (Playwright)

# Runs the full Playwright suite (logic + api + ui, 40 tests) against the web
# bundle in Chromium — the same UI + IndexedDB service layer the desktop app
# ships. Fast, no native toolchain required (unlike desktop-e2e.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc -b

      - name: Run Playwright suite
        run: npm test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
