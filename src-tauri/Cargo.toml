[package]
name = "jewel-erp"
version = "0.2.4"
description = "Jewel-ERP — offline-first jewellery store ERP (desktop)"
authors = ["Jewel-ERP"]
edition = "2021"
rust-version = "1.77"

# The library that the desktop binary (and mobile, if ever added) shares.
[lib]
name = "jewel_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# SQLite persistence exposed to the frontend via the JS @tauri-apps/plugin-sql API.
# Vendored fork of tauri-plugin-sql 2.4.0 with a one-line change: the SQLite pool
# is pinned to a single connection so cross-call BEGIN/COMMIT transactions hold
# (see vendor/tauri-plugin-sql/src/wrapper.rs). The upstream multi-connection pool
# breaks every money-sensitive multi-write path under the cutover.
tauri-plugin-sql = { path = "vendor/tauri-plugin-sql", features = ["sqlite"] }
# File-system write + native folder picker — used by the "backup to a Google
# Drive sync folder" feature (Settings → Backup).
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# Opens external URLs (e.g. WhatsApp wa.me links) in the OS default handler —
# WebView2 does not honour window.open to external sites reliably.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Stable hardware machine id for offline license locking (reads OS MachineGuid).
machine-uid = "0.5"

[features]
# Disables the auto-generated dev-server console window on Windows release builds.
default = []
